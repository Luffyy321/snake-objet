<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake objet — la base</title>
<!--
  La base du 4 novembre : snake.js est le Snake en objets vu le 14 octobre, à l'octet.
  Tout ce que vous allez écrire est dans snake.js. Elle s'ouvre par double-clic, sans serveur.
-->
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0; min-height: 100vh; box-sizing: border-box; padding: 1rem;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 1rem;
    background: #08121a; color: #cfe3ee;
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  canvas { border: 2px solid #1d3a4d; border-radius: 6px; max-width: 100%; }
  p { margin: 0; color: #7fa3b8; text-align: center; }
  kbd {
    font: inherit; font-size: .85em; background: #12222e;
    border: 1px solid #24404f; border-radius: 4px; padding: .1em .4em;
  }
  h1 { margin: 0; font-size: 1.1rem; font-weight: 600; letter-spacing: .02em; }
</style>
</head>
<body>

<h1>Snake &mdash; le v&ocirc;tre</h1>
<canvas id="jeu" width="1000" height="480"></canvas>
<p><kbd>&larr;</kbd> <kbd>&uarr;</kbd> <kbd>&darr;</kbd> <kbd>&rarr;</kbd> pour diriger &middot; <kbd>R</kbd> pour rejouer &middot; <kbd>F12</kbd> : <code>plateau</code> dans la console</p>

<script src="verifier.js"></script>  <!-- le vérificateur -->
<script src="snake.js"></script>
</body>
</html>
